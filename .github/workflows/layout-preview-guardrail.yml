name: Guardrail contra scripts de preview em layout

# Débito D53. Valida que nenhum marcador de preview (impeccable-live,
# tags <script> com localhost:8400 ou scripts live reload) seja acidentalmente
# commitado em src/app/layout.tsx ou na base de código.
#
# Escopo deliberadamente estreito: roda os testes de guardrail estático e layout
# em poucos segundos sem necessidade de banco de dados.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  guardrail-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: validar ausência de scripts de preview em layout e código (D53)
        run: pnpm vitest run --project unit src/lib/security/guardrail-preview-layout.test.ts src/app/layout.test.tsx
