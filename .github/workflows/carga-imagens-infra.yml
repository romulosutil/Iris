name: Carga das imagens de infra

# Fecha a #157. `pnpm test`, `pnpm typecheck` e `pnpm lint` rodam contra a
# ÁRVORE DO REPO — onde o arquivo importado existe e a dependência está no
# node_modules da raiz. As imagens de `infra/escalonamento/`, `infra/backup/` e
# `infra/billing/` não compartilham nem uma coisa nem outra (copiam arquivo a
# arquivo e instalam dependência à mão, de propósito), então os três ficam
# VERDES com a imagem quebrada. Foi assim que a #126 derrubou o motor de
# escalonamento em produção por ~20 minutos com ERR_MODULE_NOT_FOUND, com review
# e CI verdes (PR #156).
#
# A imagem de billing (#288) entra aqui por um motivo distinto: ela não instala
# NADA de propósito, então o que se prova nela é COPY, `bash` e a guarda de
# execução do `.mjs` — e um exit 0 silencioso ali significaria "o faturamento
# rodou" quando nada rodou.
#
# Este workflow não inspeciona o Dockerfile: ele CONSTRÓI a imagem e CARREGA o
# código lá dentro. A lógica toda mora em `scripts/ci/carga-imagens-infra.sh`,
# que roda igual na máquina do dev — um teste que só existe no workflow é um
# teste que ninguém roda antes de abrir o PR.

on:
  pull_request:
    # Só os caminhos que ENTRAM nas imagens (o que os Dockerfiles copiam ou
    # instalam), mais o próprio workflow e o script. `pnpm-lock.yaml` está aqui
    # porque as versões de `postgres`/`resend` na imagem do escalonamento são
    # pinadas à mão e precisam acompanhar o lockfile — um bump lá tem que
    # reexercitar a carga aqui.
    paths:
      - "scripts/**"
      - "infra/escalonamento/**"
      - "infra/backup/**"
      - "infra/billing/**"
      - "infra/retencao/**"
      # `carga_alarme()` existe em `scripts/ci/carga-imagens-infra.sh` (no
      # `case` e em `todos`) desde que a imagem foi criada, mas `infra/alarme/**`
      # nunca entrou neste `paths` — então mudar o Dockerfile ou o agendador do
      # alarme não disparava CI nenhum. Mesmo buraco que o D64 fechou para
      # `arquivamento`, que passou despercebido aqui.
      - "infra/alarme/**"
      - "infra/exportacao/**"
      - "infra/arquivamento/**"
      # Imagem criada em 03/09/2026 (#536): a medição em produção mostrou que
      # o serviço `iris-expurgo-audit-log` nunca existiu no Easypanel.
      - "infra/expurgo-audit-log/**"
      # `infra/asr/**` são DUAS imagens (`Dockerfile`, Python/faster-whisper, e
      # `Dockerfile.agendador`, Node) e NENHUMA das duas era construída por CI
      # nenhum — nem aqui no `paths`, nem no `case` do script. Mesmo buraco que
      # o D64 fechou para `arquivamento` e que o comentário do `alarme` acima já
      # registrava. Gravidade específica desta: `requests` está pinado em
      # `infra/asr/requirements.txt` por causa de uma quebra REAL de build
      # (`ModuleNotFoundError: No module named 'requests'`, medida no log do
      # Easypanel em 31/08/2026), e nenhum comando do repo olha uma linha de
      # Python — um bump nesse pin ficava 100% verde sem a imagem ser
      # construída uma única vez.
      - "infra/asr/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/carga-imagens-infra.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "infra/escalonamento/**"
      - "infra/backup/**"
      - "infra/billing/**"
      - "infra/retencao/**"
      # `carga_alarme()` existe em `scripts/ci/carga-imagens-infra.sh` (no
      # `case` e em `todos`) desde que a imagem foi criada, mas `infra/alarme/**`
      # nunca entrou neste `paths` — então mudar o Dockerfile ou o agendador do
      # alarme não disparava CI nenhum. Mesmo buraco que o D64 fechou para
      # `arquivamento`, que passou despercebido aqui.
      - "infra/alarme/**"
      - "infra/exportacao/**"
      - "infra/arquivamento/**"
      # Imagem criada em 03/09/2026 (#536): a medição em produção mostrou que
      # o serviço `iris-expurgo-audit-log` nunca existiu no Easypanel.
      - "infra/expurgo-audit-log/**"
      # `infra/asr/**` são DUAS imagens (`Dockerfile`, Python/faster-whisper, e
      # `Dockerfile.agendador`, Node) e NENHUMA das duas era construída por CI
      # nenhum — nem aqui no `paths`, nem no `case` do script. Mesmo buraco que
      # o D64 fechou para `arquivamento` e que o comentário do `alarme` acima já
      # registrava. Gravidade específica desta: `requests` está pinado em
      # `infra/asr/requirements.txt` por causa de uma quebra REAL de build
      # (`ModuleNotFoundError: No module named 'requests'`, medida no log do
      # Easypanel em 31/08/2026), e nenhum comando do repo olha uma linha de
      # Python — um bump nesse pin ficava 100% verde sem a imagem ser
      # construída uma única vez.
      - "infra/asr/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/carga-imagens-infra.yml"
  # Botão manual: útil para reexercitar as imagens depois de uma mudança de base
  # (node:22-alpine / postgres:17-alpine sobem sozinhas) sem esperar um PR.
  workflow_dispatch:

concurrency:
  group: carga-imagens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  carga:
    runs-on: ubuntu-latest
    # 30, não 20: a imagem de `infra/asr/Dockerfile` é a única não-alpine da
    # lista (python:3.12-slim + apt de ffmpeg/build-essential + wheels de
    # ctranslate2/faster-whisper), e sozinha custa mais que todas as outras
    # somadas. Continua sem o download do modelo — a carga para no estágio
    # `carga`, antes dele (ver a nota em scripts/ci/carga-imagens-infra.sh).
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Um job só, sequencial, em vez de matrix por serviço: quase todos são
      # builds alpine pequenos e o log fica em um lugar só na hora de ler o
      # incidente. A exceção é a imagem Python do ASR — se um dia ela dominar o
      # tempo de parede, o corte natural é ela num job separado, não uma matrix
      # por serviço.
      - name: Buildar e carregar as imagens de infra
        run: bash scripts/ci/carga-imagens-infra.sh
