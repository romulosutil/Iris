name: CI

# Diagnóstico (medido, não suposto): `pr-review.yml` é o único workflow
# `pull_request` hoje e roda com `fail_on: never` — nunca bloqueia merge.
# `migrations-integrity.yml` e `legal-versions-integrity.yml` rodam cada um UM
# arquivo de teste específico via `pnpm vitest run --project unit <arquivo>`,
# não a suíte. Nenhum workflow existente roda `pnpm test`, `pnpm test:rls`,
# `pnpm typecheck` ou `pnpm lint`. É esse buraco que este arquivo fecha: 5
# jobs reais, que bloqueiam merge (sem `fail_on: never`, sem `continue-on-error`).
#
# Duas armadilhas medidas nesta sessão, respeitadas abaixo:
#
#   A) `pnpm test` NÃO coleta `*.int.test.ts` (`vitest.config.ts` exclui de
#      propósito). Integração exige `--config vitest.integration.config.ts`.
#      Cada job de teste roda `scripts/ci/verificar-cobertura-testes.mjs`
#      contra o `--reporter=json` do vitest, com PISO MEDIDO de
#      arquivos/testes — não confiamos só no exit code.
#
#   B) Verde com muitos "skipped" é vermelho disfarçado — 64 de 68 arquivos
#      RLS foram pulados em silêncio num incidente real porque
#      `DATABASE_URL` apontava pra role DONA (BYPASSRLS) e faltava
#      `MIGRATION_DATABASE_URL`. Por isso o job `test-rls` abaixo PROVISIONA
#      as duas roles LOGIN (`iris_app`, `iris_auth_login`) como membros dos
#      roles de privilégio criados pelas migrações — nunca usa `iris` (dona)
#      como `DATABASE_URL` — e o script de cobertura reprova se houver
#      QUALQUER teste "pending" (pulado por ambiente).
#
# `CPF_HASH_SALT` (pitfall C, `src/lib/security/cpf-hash.ts`) não tem
# fallback por design — sem ele, ~22 testes de
# `pacientes/novo/actions.int.test.ts` falham. Valor de teste fixo abaixo.
#
# `pnpm format` NUNCA é chamado aqui (pitfall D) — reformata o repo inteiro.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Runtime de teste — nunca usado fora de CI/dev local. Sem exposição real.
  CPF_HASH_SALT: "ci-test-salt-nao-usar-em-producao"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `withTenant`/`comEscrita` (src/db/rls.ts) abrem uma transação REAL mesmo
    # quando o teste "unitário" mocka a lógica de negócio chamada dentro dela
    # — então até o job "unit" precisa de um Postgres alcançável (sem schema
    # migrado; só a conexão + `set_config` precisam funcionar).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: iris
          POSTGRES_PASSWORD: iris
          POSTGRES_DB: iris
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iris -d iris"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://iris:iris@localhost:5432/iris
    steps:
      - uses: actions/checkout@v4
        with:
          # profundidade completa: src/db/migrations-vs-main.test.ts compara
          # o journal local contra `origin/main` via `git show` — precisa do
          # ref alcançável, não só do commit do PR.
          fetch-depth: 0

      - name: buscar origin/main para o guard de migrações
        run: git fetch origin main

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: suíte completa — unit, a11y, storybook (com relatório JSON)
        run: pnpm vitest run --reporter=json --reporter=default --outputFile=test-report.json

      # Piso medido em 18/08/2026: 202 arquivos, 1412 testes, 0 falha, 0 pulado
      # (`node scripts/ci/verificar-cobertura-testes.mjs` sobre test-report.json).
      # Quebra por projeto na mesma medição: unit 117 arq/1123 testes, a11y
      # 26/142, storybook 59/147 — o piso agregado é baixo o bastante pra não
      # travar crescimento e alto o bastante pra reprovar se QUALQUER um dos
      # três projetos sumir inteiro da coleta (o menor deles, a11y, derruba os
      # arquivos pra 176 < 180). Margem de segurança sob o valor real, pra
      # pegar queda abrupta sem travar todo crescimento da suíte.
      - name: gate anti-pulo-silencioso (unit + a11y + storybook)
        run: node scripts/ci/verificar-cobertura-testes.mjs test-report.json --min-tests=1300 --min-files=180 --label=testes

  test-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: iris
          POSTGRES_PASSWORD: iris
          POSTGRES_DB: iris
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iris -d iris"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: iris
      MIGRATION_DATABASE_URL: postgres://iris:iris@localhost:5432/iris
      DATABASE_URL: postgres://iris_app:iris_app@localhost:5432/iris
      AUTH_DATABASE_URL: postgres://iris_auth_login:iris_auth_login@localhost:5432/iris
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Cache do binário do Chromium para evitar download repetitivo de ~150MB
      - name: cache dos navegadores do Playwright
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: instalar binário do Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      - name: aplicar migrações (role dona, BYPASSRLS)
        run: pnpm db:migrate

      # Roles LOGIN nunca são versionadas em migração de propósito (senha
      # ficaria commitada) — infra/README.md documenta o provisionamento
      # manual por ambiente. `app_role` (0001) e `iris_auth` (0002) já
      # existem como roles de privilégio NOLOGIN depois do `db:migrate`
      # acima; aqui só criamos as duas roles LOGIN que se juntam a elas —
      # nunca usamos `iris` (dona/BYPASSRLS) como DATABASE_URL de app.
      - name: provisionar roles de aplicação (iris_app, iris_auth_login)
        run: |
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE iris_app LOGIN PASSWORD 'iris_app' IN ROLE app_role;
          CREATE ROLE iris_auth_login LOGIN PASSWORD 'iris_auth_login' IN ROLE iris_auth;
          SQL

      - name: suíte de integração/RLS (com relatório JSON)
        run: pnpm vitest run --config vitest.integration.config.ts --reporter=json --reporter=default --outputFile=int-report.json

      # Piso medido em 15/08/2026 contra um Postgres isolado, do zero. Valor
      # do próprio job, em `main` mergeada (run 31919854357):
      # 100 arquivos, 846 testes, 0 falha, 0 pending. São 100 e não 101 porque
      # `main` removeu `src/app/(app)/assinatura/gate-debito.int.test.ts` — o
      # piso de 95 continua válido, com folga de 5 arquivos.
      # `numPendingTests > 0`
      # é o sintoma exato do incidente de 64/68 arquivos pulados em
      # silêncio (DATABASE_URL apontando pra role BYPASSRLS) — o script
      # reprova o job nesse caso mesmo com exit code 0 do vitest.
      - name: gate anti-pulo-silencioso (integração/RLS)
        run: node scripts/ci/verificar-cobertura-testes.mjs int-report.json --min-tests=800 --min-files=95 --label=integração

  test-e2e:
    # #424 — suíte `e2e/` nunca rodava em CI. `pnpm test:e2e` sobe o Next em
    # modo produção (`next start`, playwright.config.ts) e a suíte inteira
    # compartilha 1 banco (`workers: 1`) — `pnpm seed:e2e` semeia num único
    # truncate os dois cenários que os specs precisam (clínica E2E + clínica
    # demo, scripts/seed-e2e.ts). O cenário do ditado de voz já vem nesse
    # mesmo truncate (`Paciente Ditado E2E` às 11:00, scripts/lib/
    # seed-demo-clinic.ts) — nenhum seed extra, e nenhum `seed:demo` avulso,
    # que truncaria por cima.
    #
    # #501 — além do Postgres, este job sobe MinIO e exporta as envs de ASR:
    # sem elas o `playwright.config.ts` nem declara o projeto `ditado-voz` e
    # `e2e/ditado-voz.spec.ts` era coletado ZERO vez aqui, com o job verde.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: iris
          POSTGRES_PASSWORD: iris
          POSTGRES_DB: iris
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iris -d iris"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: iris
      MIGRATION_DATABASE_URL: postgres://iris:iris@localhost:5432/iris
      DATABASE_URL: postgres://iris_app:iris_app@localhost:5432/iris
      AUTH_DATABASE_URL: postgres://iris_auth_login:iris_auth_login@localhost:5432/iris
      # Segredo de teste, nunca usado fora de CI — mesmo padrão do
      # CPF_HASH_SALT global deste workflow.
      BETTER_AUTH_SECRET: "ci-test-better-auth-secret-nao-usar-em-producao"

      # ---- Ditado de voz / ASR (#501) -------------------------------------
      #
      # Estas 5 primeiras são EXATAMENTE as que `playwright.config.ts` exige
      # em `asrE2ePronto` para declarar o projeto `ditado-voz`. Errar um nome
      # aqui não quebra nada: o projeto simplesmente não é criado e o spec
      # volta a ser coletado zero vez, com o job verde — que é o defeito que
      # a #501 fecha. Qualquer mexida nestes nomes tem que ser conferida
      # contra o `asrE2ePronto` do config, não contra a memória.
      FEATURE_FLAG_ASR_ENABLED: "true"
      # MinIO sobe via `docker run` num step abaixo, com a porta 9000
      # publicada no host — o job roda direto no runner (não dentro de um
      # container), então `localhost` é o mesmo endereço que ele já usa para
      # o Postgres do bloco `services:`.
      ASR_S3_ENDPOINT: http://localhost:9000
      ASR_S3_ACCESS_KEY: iris
      ASR_S3_SECRET_KEY: iris123456
      # Segredo de teste, nunca usado fora de CI (mesmo padrão do
      # BETTER_AUTH_SECRET acima). O spec dispara o worker com ele.
      ASR_JOB_TOKEN: "ci-test-asr-job-token-nao-usar-em-producao"
      # Fora das 5 do gate, mas igualmente obrigatória: `resolveConfig()` de
      # `src/lib/asr/storage.ts` cai no default `iris-asr-efemero` se ausente.
      # Explícita porque é o mesmo nome que o step de criação do bucket usa —
      # divergir faria o upload escrever num bucket inexistente.
      ASR_S3_BUCKET: iris-asr-efemero
      # `ASR_PROVIDER` fica AUSENTE de propósito (a #501 pedia `stub`, valor
      # que não existe no domínio): `getAsrProvider()` só devolve o
      # `SelfHostedAsrProvider` quando lê exatamente `self-hosted` — qualquer
      # outro valor, inclusive nenhum, cai no `StubAsrProvider` (R22). Gravar
      # um valor fictício sugeriria um enum que o código não tem.
      #
      # A rota do worker NÃO fala com o banco pelo pool da app: as funções
      # `app_asr_*` são SECURITY DEFINER cross-tenant e o EXECUTE saiu de
      # `app_role` na `0140`. Sem esta env o `asrWorkerDb` recusa abrir
      # conexão (fail-closed, sem cair para DATABASE_URL) e o tick do spec
      # volta 500. A role NOLOGIN `iris_asr_worker` nasce na migração; a
      # LOGIN é provisionada no step de roles, como as outras duas.
      ASR_WORKER_DATABASE_URL: postgres://iris_asr_worker_login:iris_asr_worker_login@localhost:5432/iris
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: cache dos navegadores do Playwright
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: instalar binário do Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      - name: aplicar migrações (role dona, BYPASSRLS)
        run: pnpm db:migrate

      # Mesmo padrão do job test-rls: só as roles LOGIN, nunca `iris`
      # (dona/BYPASSRLS) como DATABASE_URL de app.
      #
      # `iris_asr_worker_login` (#501) é membro de `iris_asr_worker`, a role
      # NOLOGIN criada pela migração `0140_asr_worker_role.sql` — ela existe a
      # partir do `pnpm db:migrate` acima. É a credencial do
      # `ASR_WORKER_DATABASE_URL`: o EXECUTE das funções `app_asr_*` saiu de
      # `app_role` na `0140`, então o tick do worker com a credencial da app
      # levaria `42501`.
      - name: provisionar roles de aplicação (iris_app, iris_auth_login, iris_asr_worker_login)
        run: |
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE iris_app LOGIN PASSWORD 'iris_app' IN ROLE app_role;
          CREATE ROLE iris_auth_login LOGIN PASSWORD 'iris_auth_login' IN ROLE iris_auth;
          CREATE ROLE iris_asr_worker_login LOGIN PASSWORD 'iris_asr_worker_login' IN ROLE iris_asr_worker;
          SQL

      # MinIO para o spec do ditado de voz (#501). É o único da suíte que
      # precisa de storage S3 — sem ele o projeto `ditado-voz` do
      # `playwright.config.ts` nem chega a ser declarado.
      #
      # POR QUE `docker run` E NÃO O BLOCO `services:` (como o Postgres):
      # `services:` não passa comando nem argumentos ao container (só `image`,
      # `env`, `ports`, `volumes` e `options`, que vão para o `docker create`
      # ANTES da imagem). O `minio/minio` tem `ENTRYPOINT
      # ["/usr/bin/docker-entrypoint.sh"]` + `CMD ["minio"]`, e `minio` sem
      # subcomando imprime o help e sai 0 — medido contra esta tag. O servidor
      # exige `server /data`, que só dá para passar aqui.
      #
      # Tag DATADA, nunca `latest`: é a mesma de `infra/docker-compose.yml` e
      # do dev local, porque o `S3Client` já quebrou por mudança de
      # comportamento entre releases do MinIO (#504). Subir de versão é
      # decisão explícita, nos dois arquivos ao mesmo tempo.
      - name: subir MinIO (storage efêmero do ditado de voz)
        run: |
          docker run -d --name iris-minio-ci \
            -p 9000:9000 \
            -e MINIO_ROOT_USER="$ASR_S3_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$ASR_S3_SECRET_KEY" \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          # Mesma sonda do healthcheck do docker-compose. O laço FALHA ao
          # estourar: seguir em frente com o MinIO fora do ar deixaria o spec
          # quebrar 5 minutos depois, num clique que não acha botão.
          for tentativa in $(seq 1 60); do
            if docker exec iris-minio-ci mc ready local; then
              echo "MinIO pronto após ${tentativa}s"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO não ficou pronto em 60s — logs abaixo" >&2
          docker logs iris-minio-ci >&2
          exit 1

      # O bloco `services:` não roda comando pós-boot, e o `docker run` acima
      # também não cria bucket — daí este step próprio. O `mc` já vem dentro
      # da imagem do servidor (é o que o healthcheck do compose usa), então
      # não há binário para baixar.
      #
      # ⚠️ O alias `local` embutido na imagem é ANÔNIMO: `mc ready local`
      # funciona com ele, mas `mc mb local/...` volta `Access Denied`
      # (medido). Por isso o alias é registrado aqui com as credenciais.
      # `--ignore-existing` deixa o step idempotente em re-run do job.
      - name: criar bucket do ASR no MinIO
        run: |
          docker exec iris-minio-ci mc alias set irisci \
            http://127.0.0.1:9000 "$ASR_S3_ACCESS_KEY" "$ASR_S3_SECRET_KEY"
          docker exec iris-minio-ci mc mb --ignore-existing "irisci/$ASR_S3_BUCKET"
          docker exec iris-minio-ci mc ls irisci

      # `webServer` do playwright.config.ts invoca o binário do Next direto
      # (`next start`) — precisa do build de produção pronto antes.
      - name: build de produção da aplicação (Next.js)
        run: pnpm build

      - name: seed da suíte e2e (clínica E2E + clínica demo)
        run: pnpm seed:e2e

      - name: suíte e2e (com relatório JSON)
        run: pnpm test:e2e --reporter=json,list
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-report.json

      # Pisos medidos em 06/09/2026 com `pnpm exec playwright test --list`
      # nesta branch: 21 arquivos, 64 testes (servidor=1, chromium=21,
      # mobile-360=41, ditado-voz=1). SEM as envs de ASR o mesmo comando
      # devolve 20 arquivos / 63 testes — a diferença é exatamente o spec do
      # ditado, que é o que a #501 traz para dentro da coleta.
      #
      # POR QUE OS PISOS SÃO A CONTAGEM EXATA, E NÃO UM NÚMERO FOLGADO: os
      # anteriores (17/10) foram medidos em 23/08/2026, antes dos specs
      # `mobile-*` entrarem, e nunca subiram. Com 63 testes rodando contra um
      # piso de 17, dava para apagar 46 testes e 10 arquivos sem o gate
      # piscar — inclusive o de ditado que esta mesma issue acabou de ligar.
      # Piso frouxo é gate desligado com aparência de ligado.
      #
      # Consequência assumida: quando um teste falha de verdade ele sai de
      # `expected` (vira `unexpected`) e o gate imprime DUAS linhas — a da
      # falha e um "cobertura caiu abaixo do esperado". A segunda é ruído da
      # primeira, não um spec sumido. Teste flaky não dispara isso: o script
      # soma `expected + flaky` de propósito (memória
      # `playwright-flaky-sai-de-expected`).
      #
      # `--flaky-baseline` (#542, Q-06): teto por arquivo de flake conhecido
      # (só o projeto [mobile-360], ver comentário no .mjs) — qualquer flake
      # novo, ou acima do teto, reprova o job em vez de passar em silêncio.
      - name: gate anti-pulo-silencioso (e2e)
        run: node scripts/ci/verificar-cobertura-e2e.mjs e2e-report.json --min-tests=64 --min-files=21 --flaky-baseline=scripts/ci/e2e-flaky.baseline.json

      # `ubuntu-latest` é descartável e não precisaria disto — mas este repo
      # já roda parte do CI em runner self-hosted, e lá um container com nome
      # fixo sobrevivendo ao job faria a próxima execução morrer em
      # "name is already in use", com a porta 9000 ainda presa. `if: always()`
      # porque a limpeza vale principalmente quando a suíte falhou — e por
      # isso o `|| true`: se o job morreu ANTES de subir o container, não há o
      # que remover, e um step de limpeza vermelho só esconderia a falha real.
      - name: derrubar MinIO
        if: always()
        run: docker rm --force iris-minio-ci || true

  # NÃO é duplicata do `pnpm build` que o `test-e2e` roda (linha ~274) — e não
  # deve ser apagado como se fosse. A diferença é o AMBIENTE, não o comando:
  # este job roda `pnpm build` SEM `DATABASE_URL` e sem Postgres nenhum; o
  # `test-e2e` roda com o banco de pé e as três URLs setadas no `env:` do job.
  #
  # O invariante que só este job segura: **a aplicação compila sem banco.**
  # `infra/Dockerfile:40` roda `pnpm build` dentro da imagem, onde não existe
  # Postgres — e essa imagem NÃO é construída em CI (o
  # `carga-imagens-infra.yml` cobre as 7 imagens de job, nunca o
  # `infra/Dockerfile` do app). Ou seja: se alguém introduzir acesso ao banco
  # em build time (page estática que consulta no server, `generateStaticParams`
  # que lê tabela), o `test-e2e` passa verde — ele TEM banco — e a falha só
  # aparece no `docker build` do deploy, em produção. Este job é o único gate
  # pré-deploy desse caso. Custo medido: ~1m05s. Ver D69.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build de produção da aplicação (Next.js)
        run: pnpm build

  # --- D69: as duas imagens do deploy do APP, construídas e BOOTADAS aqui ------
  #
  # `carga-imagens-infra.yml` cobre 8 imagens de JOB e nenhuma delas é a do app;
  # `infra/Dockerfile` e `infra/Dockerfile.migrate` também não caem em nenhum dos
  # `paths` dele. Resultado até aqui: mudar qualquer um dos dois disparava ZERO
  # CI e a primeira execução era o deploy em produção — foi assim que o
  # `@swc/helpers`/`module-sync` deixou o `docker build` verde e o
  # `node server.js` morto no boot. O job `build` acima é vizinho, não
  # substituto: ele prova só que a aplicação COMPILA SEM BANCO (ver o comentário
  # lá), nunca que a IMAGEM sobe.
  #
  # A lógica toda mora em `scripts/ci/carga-imagem-app.sh`, que roda igual na
  # máquina do dev — mesma regra do `carga-imagens-infra.sh`: teste que só existe
  # no workflow é teste que ninguém roda antes de abrir o PR.
  imagens-do-app-alteradas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      alterado: ${{ steps.decidir.outputs.alterado }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # O predicado é INVERTIDO de propósito, e é a forma que o D68 já tinha
      # prescrito para este repo: não se pergunta "esta PR mexe na imagem?"
      # (indecidível — o stage `build` faz `COPY . .`, então TUDO que não está
      # no `.dockerignore` entra), e sim "esta PR é PROVADAMENTE zero-código?".
      # Default = roda, allowlist mínima, fail-closed. Uma lista positiva de
      # caminhos aqui seria o D64/D69 reencenado: o buraco daqueles dois foi
      # exatamente um `paths` que esqueceu de listar algo que entra na imagem.
      #
      # `docs/legal/**` NÃO é ignorável: `/termos` e `/privacidade` são
      # `force-static` e leem esse markdown do disco durante o `pnpm build` de
      # dentro da imagem — é a cadeia de desexclusão do `.dockerignore`, e é
      # justamente o que o probe de boot verifica.
      - name: decidir se a carga das imagens do app roda
        id: decidir
        env:
          EVENTO: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -Eeuo pipefail

          if [[ "${EVENTO}" != "pull_request" ]]; then
            echo "evento=${EVENTO} (não é PR) — roda sempre."
            echo "alterado=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          arquivos="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          echo "Arquivos no diff:"
          printf '%s\n' "${arquivos}" | sed 's/^/  /'

          relevante=false
          while IFS= read -r f; do
            [[ -z "${f}" ]] && continue
            case "${f}" in
              docs/legal/*) relevante=true; break ;;
              .github/workflows/ci.yml) relevante=true; break ;;
              docs/*|*.md|.github/*|.claude/*|graphify-out/*) continue ;;
              *) relevante=true; break ;;
            esac
          done <<< "${arquivos}"

          echo "alterado=${relevante}" >> "$GITHUB_OUTPUT"
          echo "Decisão: alterado=${relevante}"

  # Job SKIPPED reporta sucesso ao ruleset; workflow que não roda não reporta
  # nada e trava o PR para sempre (D58/#423, D68). Por isso o gate é um `if:` de
  # JOB e nunca um `paths:` no `on:` deste workflow.
  carga-imagem-app:
    needs: imagens-do-app-alteradas
    if: needs.imagens-do-app-alteradas.outputs.alterado == 'true'
    runs-on: ubuntu-latest
    # Teto generoso de propósito: o alvo é ~3 min com o cache do Buildx quente,
    # mas o caminho FRIO (cache evictado, bump de `pnpm-lock.yaml`, base nova)
    # paga `pnpm install` + `pnpm build` + o download do Chromium do stage
    # `runner`. Um timeout apertado transformaria cache frio em CI vermelho —
    # que é exatamente o falso-negativo que este job existe para não produzir.
    timeout-minutes: 30
    services:
      # Só o passo final do migrate usa este Postgres: rodar o migrator DE
      # VERDADE de dentro da imagem é o que prova o gate de schema inteiro
      # (conexão + guard de hash D17 + aplicação), e não só que o módulo
      # carregou.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: iris
          POSTGRES_PASSWORD: iris
          POSTGRES_DB: iris
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iris -d iris"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_DATABASE_URL_CARGA: postgres://iris:iris@host.docker.internal:5432/iris
      # `--cache-to type=gha` exige o driver `docker-container` do buildx (o
      # passo abaixo o provisiona). `mode=max` guarda também os stages
      # intermediários — é o que faz `deps`/`build` reaproveitarem entre PRs;
      # sem ele só a imagem final entra no cache e o `pnpm build` roda inteiro
      # toda vez. O custo é cota de cache do Actions, e o pior caso de eviction
      # é ESTE job ficar lento, nunca ficar errado.
      ARGS_BUILD_EXTRA: >-
        --cache-from type=gha,scope=imagem-app
        --cache-to type=gha,mode=max,scope=imagem-app
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: carga das imagens do app (build + boot) — infra/Dockerfile{,.migrate}
        run: bash scripts/ci/carga-imagem-app.sh
