name: Integridade das versões legais

# Débito D20 / issue #261. O guard `src/lib/legal.test.ts` roda no `pnpm test`,
# mas o repo não tem nenhum workflow que rode a suíte inteira em PR — mesma
# lacuna que motivou `migrations-integrity.yml` (D2/#187). Sem este arquivo, o
# "guardrail de CI" contra duplicidade de VERSAO_TERMO/VERSAO_POLITICA
# dependeria de alguém lembrar de rodar os testes localmente — exatamente a
# falha que deixou a duplicata de 07/08/2026 passar despercebida.
#
# Escopo deliberadamente estreito: roda **só** os testes de `legal.test.ts`
# (fonte única das versões, acoplamento constante↔markdown, cláusula 10 do
# advogado, contexto de build do Docker). Não precisa de banco, de browser nem
# de segredo, então custa poucos segundos e nunca fica vermelho por motivo
# alheio.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  versoes-legais:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: fonte única e acoplamento das versões legais
        run: pnpm vitest run --project unit src/lib/legal.test.ts
