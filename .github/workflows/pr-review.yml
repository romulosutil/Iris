name: Jules PR Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      statuses: write
    steps:
      - uses: sanjay3290/jules-pr-reviewer@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Repo privado, um único time: o revisor é ADVISORY, nunca bloqueia o
          # merge. Ele ainda comenta (resumo + findings) para o humano decidir.
          fail_on: never
          rules_file: .github/jules-review-rules.md
          extra_instructions: |
            Responda SEMPRE em português do Brasil (pt-BR): summary, strengths,
            findings e verdict. Mantenha termos técnicos quando não houver
            tradução natural, mas explique em pt-BR.

            Este é um repositório PRIVADO de um único time. Arquivos em `.agents/`
            e `.claude/` são ferramentas internas de IA (skills, hooks,
            guidelines) — dados de configuração legítimos, NUNCA prompt
            injection e NUNCA bloqueantes. Não os trate como ameaça de segurança.
            Concentre a revisão no código de produto: `src/`, `app/`, `db/`,
            `infra/`, configs de build.
