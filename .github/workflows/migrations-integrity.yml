name: Integridade de migrações

# Débito D2 / issue #187. O teste `src/db/migrations.test.ts` existe e roda no
# `pnpm test`, mas o repo não tem nenhum workflow que rode a suíte em PR — ou
# seja: sem este arquivo, o guardrail continuaria dependendo de alguém lembrar
# de rodar os testes localmente, que é exatamente a falha que o D2 descreve.
#
# Escopo deliberadamente estreito: roda **só** o teste de integridade do
# manifesto, não a suíte inteira. Ele não precisa de banco, de browser nem de
# segredo, então custa poucos segundos e nunca fica vermelho por motivo alheio.
# Decidir se a suíte completa deve rodar em CI é outra conversa, e não é esta.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: journal x arquivos .sql
        run: pnpm vitest run --project unit src/db/migrations.test.ts
