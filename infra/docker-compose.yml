# Dev local com paridade de produção: Postgres + MinIO.
# O app roda fora do compose (`pnpm dev`) apontando para estes serviços.
# Subir: docker compose -f infra/docker-compose.yml up -d
#
# .env local correspondente:
#   DATABASE_URL=postgres://iris:iris@localhost:5433/iris
#   S3_ENDPOINT=http://localhost:9000
#   S3_ACCESS_KEY=iris
#   S3_SECRET_KEY=iris123456
#   S3_BUCKET=iris-audio

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: iris
      POSTGRES_DB: iris
    ports:
      - "5433:5432" # host 5433 evita conflito com outros Postgres locais
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iris -d iris"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Cota máxima do serviço de PRIORIDADE MÁXIMA (#631). Ver a tabela de
    # orçamento e o porquê de cada número em infra/README.md, seção
    # "Cotas de CPU e memória".
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 6G
        reservations:
          # Só `memory` tem efeito: MEDIDO em Docker 29.6.2 / Compose v5.3.1
          # fora do Swarm, `reservations.cpus` é aceito pelo parser e descartado
          # em silêncio (`docker inspect` devolve `CpuShares=0`). Quem dá peso
          # relativo de CPU aqui é o campo `cpu_shares`, usado no serviço `asr`.
          memory: 2G

  minio:
    # Tag datada, não `latest` (auditoria 360, DX-04): o `S3Client` já quebrou
    # por mudança de comportamento do MinIO entre releases (#504, 31/08/2026).
    # É a release que roda no dev local hoje (`docker inspect minio/minio`,
    # label `version`); subir de versão é decisão explícita, com o teste de
    # cópia real (`infra/backup`) rodado contra a nova tag.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: iris
      MINIO_ROOT_PASSWORD: iris123456
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Console web
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1536M # 1.5 GB
        reservations:
          memory: 512M

  # Serviço ASR self-hosted (faster-whisper, #72 / cotas #631). Não sobe por
  # default (profile "asr") — o build baixa o modelo Whisper e leva minutos.
  #   docker compose -f infra/docker-compose.yml --profile asr up -d asr
  #
  # POR QUE ESTE SERVIÇO PASSOU A EXISTIR AQUI: até a #631 o Whisper só existia
  # como imagem provisionada à mão no Easypanel, e não havia NADA no repo contra
  # o que rodar o teste de carga que fecha o critério "o container do Whisper
  # nunca eleva a carga do host acima de 80% de CPU". Cota sem alvo local é cota
  # que ninguém mede — a mesma régua de `verificar-fato-de-infra-com-medicao`.
  # Os números aqui são os MESMOS do painel (infra/README.md): divergir faria o
  # ensaio local provar uma coisa e a produção rodar outra.
  asr:
    profiles: ["asr"]
    build:
      # Contexto na RAIZ do repo — mesma razão dos demais serviços.
      context: ..
      dockerfile: infra/asr/Dockerfile
      args:
        # Precisa casar com o `ASR_MODEL_SIZE` do `environment` abaixo: o ARG
        # decide qual modelo entra no cache da imagem, a env decide qual o
        # servidor.py instancia. Divergiram, o boot tenta baixar em runtime e a
        # garantia de `--network=none` do Dockerfile morre.
        ASR_MODEL_SIZE: "${ASR_MODEL_SIZE:-small}"
    environment:
      ASR_MODEL_SIZE: "${ASR_MODEL_SIZE:-small}"
      ASR_LANGUAGE: "${ASR_LANGUAGE:-pt}"
      # Fail-closed no servidor.py: sem token o processo sai 1. Valor de dev
      # explícito, nunca reaproveitado em produção (lá é `openssl rand -hex 32`).
      ASR_SERVICE_TOKEN: "${ASR_SERVICE_TOKEN:-token-de-dev-local}"
      # Teto de transcrições simultâneas DENTRO do processo. Com `cpus: "1.0"`
      # abaixo, 2 concorrentes dividem 1 vCPU: cada uma fica ~2x mais lenta, e
      # nenhuma das duas estoura a cota. Mantido em 2 (o default do servidor.py)
      # de propósito — baixar para 1 é decisão de throughput a tomar com medição
      # de fila real, não de contenção de recurso, que a cota já resolve.
      ASR_MAX_CONCORRENTES: "${ASR_MAX_CONCORRENTES:-2}"
    ports:
      - "8081:8080" # host 8081: 8080 costuma estar ocupado em dev
    # `on-failure`, não `unless-stopped`: é isto que faz o critério de aceite
    # "só o ASR sofre restart" ser observável. Sem política de restart o
    # container OOM-killed fica parado em `exited (137)` e o operador lê
    # "o serviço sumiu" em vez de "o serviço bateu no teto e voltou".
    restart: on-failure
    # O "nice priority baixa" do brief. NÃO existe campo `nice` em Compose nem
    # em Swarm; o que existe é peso relativo de CPU sob CONTENÇÃO: default 1024,
    # aqui 128 = 1/8 da fatia do Postgres quando os dois disputam o mesmo núcleo.
    # Fora de contenção não limita nada (quem limita é `cpus` abaixo) — é
    # exatamente a semântica de `nice`.
    cpu_shares: 128
    deploy:
      resources:
        limits:
          cpus: "1.0" # 1 de 4 vCPU do KVM 4 = teto de 25% do host
          memory: 3G
        reservations:
          memory: 512M

  # Serviço de backup (infra/backup/) — não sobe por default (profile
  # "backup"). Rodar com:
  #   docker compose -f infra/docker-compose.yml --profile backup run --rm backup
  #   docker compose -f infra/docker-compose.yml --profile backup run --rm backup ./verify-restore.sh
  backup:
    profiles: ["backup"]
    build:
      # Contexto na RAIZ do repo (não em ./backup) para bater com o que o
      # Easypanel faz em produção. Com contextos diferentes, um `COPY` que
      # funciona aqui quebra lá — e o teste local não pega.
      context: ..
      dockerfile: infra/backup/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: iris
      PGPASSWORD: iris
      PGDATABASE: iris
      BACKUP_DIR: /backups
      RETENTION_DAYS: "30"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: iris
      S3_SECRET_KEY: iris123456
      S3_BACKUP_BUCKET: iris-backups
      # Réplica off-site (#86) DESLIGADA por default no dev local: endpoint
      # vazio = passo pulado. Não é omissão — o off-site exige uma chave
      # pública age, e chave de dev commitada no repo é chave que alguém
      # acaba reusando em produção. Para exercitar o fluxo completo (cifra +
      # upload + asserções), rode `infra/backup/test-offsite.sh`, que gera um
      # par de chaves efêmero e sobe contra o próprio MinIO local.
      OFFSITE_S3_ENDPOINT: "${OFFSITE_S3_ENDPOINT:-}"
      OFFSITE_S3_ACCESS_KEY: "${OFFSITE_S3_ACCESS_KEY:-}"
      OFFSITE_S3_SECRET_KEY: "${OFFSITE_S3_SECRET_KEY:-}"
      OFFSITE_S3_BUCKET: "${OFFSITE_S3_BUCKET:-iris-backups-offsite}"
      # Parafusos de dialeto S3, ambos desligados por default: sem região o mc
      # assina us-east-1, que é o que a OCI aceita hoje. Ver infra/README.md
      # antes de mexer — falha de autenticação off-site costuma ser credencial.
      OFFSITE_S3_REGION: "${OFFSITE_S3_REGION:-}"
      OFFSITE_S3_PATH_STYLE: "${OFFSITE_S3_PATH_STYLE:-auto}"
      OFFSITE_AGE_RECIPIENT: "${OFFSITE_AGE_RECIPIENT:-}"
      OFFSITE_INTERVAL_DAYS: "${OFFSITE_INTERVAL_DAYS:-1}"
      # Só o verify-offsite.sh lê estas três (#105) — o backup.sh e o
      # scheduler.sh as ignoram. Precisam estar declaradas aqui mesmo assim:
      # `VAR=x docker compose run backup ...` NÃO entrega a variável ao
      # container se ela não estiver no `environment:` do serviço. Sem esta
      # declaração o runbook do infra/README.md rodaria com o sha esperado
      # vazio, o script sairia 2 (VERIFICAÇÃO PARCIAL) e o operador leria
      # "a réplica não prova procedência" quando o defeito era o repasse.
      OFFSITE_EXPECTED_SHA256: "${OFFSITE_EXPECTED_SHA256:-}"
      OFFSITE_EXPECTED_SHA256_GLOBALS: "${OFFSITE_EXPECTED_SHA256_GLOBALS:-}"
      OFFSITE_MIN_CARIMBO: "${OFFSITE_MIN_CARIMBO:-}"
    volumes:
      - backupdata:/backups
    # Mais folgado que os demais jobs: `pg_dump | gzip` e a cifra `age` do
    # off-site são os únicos passos de infra que fazem trabalho de CPU/memória
    # de verdade. Apertar aqui trocaria "backup lento" por "backup morto", e
    # backup que não completa é o pior modo de falha desta lista.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G

  # Motor de escalonamento de alerta de risco (#122/H1, infra/escalonamento/).
  # Não sobe por default (profile "escalonamento"). Rodar com:
  #   docker compose -f infra/docker-compose.yml --profile escalonamento up escalonamento
  #   docker compose -f infra/docker-compose.yml --profile escalonamento run --rm \
  #     escalonamento node scripts/escalonamento-risco.mjs --dry-run
  #
  # Sem `ports:` de propósito: este serviço não expõe nada e não fala com nada
  # além do Postgres. Ele muda status no banco e loga — não existe, nem pode
  # passar a existir, canal de saída para destinatário fora da clínica.
  escalonamento:
    profiles: ["escalonamento"]
    build:
      # Contexto na RAIZ do repo (não em ./escalonamento) para bater com o que
      # o Easypanel faz em produção — mesma razão do serviço `backup`.
      context: ..
      dockerfile: infra/escalonamento/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Em dev local a role dedicada `iris_escalonamento_login` pode não
      # existir ainda; o superuser `iris` funciona para exercitar o fluxo. Em
      # PRODUÇÃO isto é sempre a role de login que herda `iris_escalonamento`
      # (sem SELECT em tabela nenhuma) — ver infra/README.md.
      ESCALONAMENTO_DATABASE_URL: "${ESCALONAMENTO_DATABASE_URL:-postgres://iris:iris@postgres:5432/iris}"
      ESCALONAMENTO_HEARTBEAT_DIR: /heartbeat
      INTERVALO_S: "${INTERVALO_S:-60}"
    volumes:
      # Volume nomeado, não bind: o heartbeat precisa sobreviver a restart do
      # container para que "heartbeat parado" signifique "motor parado" e não
      # "container reiniciou agora".
      - escalonamentodata:/heartbeat
    # Job magro (laço + POST/consulta). 256M é folga larga para um Node que
    # não carrega o app; o teto existe para que um vazamento aqui não dispute
    # memória com o Postgres, não porque este processo precise de muito.
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  # Job de fechamento de ciclo de faturamento (#36, infra/billing/).
  # Não sobe por default (profile "billing"). Rodar com:
  #   docker compose -f infra/docker-compose.yml --profile billing up billing
  #   docker compose -f infra/docker-compose.yml --profile billing run --rm \
  #     billing node scripts/fechamento-ciclo-billing.mjs --once --dry-run
  #
  # Sem `ports:` e sem `depends_on: postgres`: este job NÃO fala com o banco. Ele
  # faz um POST autenticado numa rota interna do Next, e é essa rota que apura,
  # calcula preço e chama o gateway. Ver o cabeçalho do Dockerfile para o porquê.
  billing:
    profiles: ["billing"]
    build:
      # Contexto na RAIZ do repo (não em ./billing) para bater com o que o
      # Easypanel faz em produção — mesma razão dos serviços acima.
      context: ..
      dockerfile: infra/billing/Dockerfile
    environment:
      # Em dev local aponte para o `pnpm dev` da máquina host. Sem default de
      # token: um default aqui viraria segredo commitado, e um token de billing
      # vazado é terceiro disparando cobrança.
      BILLING_JOB_URL: "${BILLING_JOB_URL:-http://host.docker.internal:3000/api/internal/billing/fechar-ciclos}"
      BILLING_JOB_TOKEN: "${BILLING_JOB_TOKEN:-}"
      BILLING_HEARTBEAT_DIR: /heartbeat
      INTERVALO_S: "${BILLING_INTERVALO_S:-3600}"
    volumes:
      # Volume nomeado, não bind: o heartbeat precisa sobreviver a restart do
      # container para que "heartbeat parado" signifique "job parado" e não
      # "container reiniciou agora".
      - billingdata:/heartbeat
    # Job magro (laço + POST/consulta). 256M é folga larga para um Node que
    # não carrega o app; o teto existe para que um vazamento aqui não dispute
    # memória com o Postgres, não porque este processo precise de muito.
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  # Job de exportação integral do acervo (#374 ∪ #353, D62, infra/exportacao/).
  # Não sobe por default (profile "exportacao"). Rodar com:
  #   docker compose -f infra/docker-compose.yml --profile exportacao up exportacao
  #   docker compose -f infra/docker-compose.yml --profile exportacao run --rm \
  #     exportacao node scripts/exportacao-acervo.mjs
  #
  # Sem `ports:` e sem `depends_on: postgres`: este job NÃO fala com o banco.
  # Ele faz um POST autenticado numa rota interna do Next, e é essa rota que
  # coleta o acervo, monta o ZIP e calcula os SHA-256. Ver o cabeçalho do
  # Dockerfile para o porquê.
  exportacao:
    profiles: ["exportacao"]
    build:
      # Contexto na RAIZ do repo (não em ./exportacao) para bater com o que o
      # Easypanel faz em produção — mesma razão dos serviços acima.
      context: ..
      dockerfile: infra/exportacao/Dockerfile
    environment:
      # Em dev local aponte para o `pnpm dev` da máquina host. Sem default de
      # token: um default aqui viraria segredo commitado.
      EXPORT_JOB_URL: "${EXPORT_JOB_URL:-http://host.docker.internal:3000/api/internal/jobs/exportacao-integral}"
      EXPORT_JOB_TOKEN: "${EXPORT_JOB_TOKEN:-}"
      EXPORT_HEARTBEAT_DIR: /heartbeat
      INTERVALO_S: "${EXPORT_INTERVALO_S:-300}"
    volumes:
      # Volume nomeado, não bind: o heartbeat precisa sobreviver a restart do
      # container para que "heartbeat parado" signifique "job parado" e não
      # "container reiniciou agora".
      - exportacaodata:/heartbeat
    # Job magro (laço + POST/consulta). 256M é folga larga para um Node que
    # não carrega o app; o teto existe para que um vazamento aqui não dispute
    # memória com o Postgres, não porque este processo precise de muito.
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

volumes:
  pgdata:
  miniodata:
  backupdata:
  escalonamentodata:
  billingdata:
  exportacaodata:
